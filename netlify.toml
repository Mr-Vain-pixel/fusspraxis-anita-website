# Netlify configuration
# Fusspraxis Anita — https://www.fusspraxis-anita.ch

[build]
  # Statische Site — kein Build-Prozess nötig
  publish = "."

# ---------- SECURITY HEADERS ----------
# Schützen vor gängigen Angriffen, aktiv auf allen URLs.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# ---------- CACHE-CONTROL ----------
# Schriften und Bilder ändern sich nie — Browser darf sie ein Jahr lang cachen.
# Beim zweiten Besuch lädt die Seite dadurch quasi sofort.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------- SAUBERE URLs ----------
# /impressum funktioniert genauso wie /impressum.html
# Trailing-Slashes werden automatisch entfernt

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# ---------- WEITERLEITUNGEN ----------
# SEO-Erhalt: Alte URL /bedeutung-der-podologie/ (mit Trailing-Slash)
# der bestehenden WordPress-Seite auf neue Seite umleiten.
# 301 = permanent, damit Google das Ranking übernimmt.

[[redirects]]
  from = "/bedeutung-der-podologie/"
  to = "/bedeutung-der-podologie.html"
  status = 301
  force = true

[[redirects]]
  from = "/bedeutung-der-podologie"
  to = "/bedeutung-der-podologie.html"
  status = 301
  force = true
